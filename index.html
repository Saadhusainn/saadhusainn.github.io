<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-filter {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-btn {
            padding: 10px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .book-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .book-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .book-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .book-author {
            font-size: 0.95rem;
            opacity: 0.9;
            font-style: italic;
        }

        .book-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .book-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .info-label {
            font-weight: 600;
            color: #333;
        }

        .info-value {
            color: #667eea;
            font-weight: 500;
        }

        .volumes-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
        }

        .volumes-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .volume-item {
            background: #f9f9f9;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
            border-radius: 3px;
            font-size: 0.85rem;
        }

        .volume-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .volume-size {
            color: #666;
            font-size: 0.8rem;
        }

        .download-btn {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .stats {
            background: white;
            padding: 20px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .no-results p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.1rem;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            header p {
                font-size: 1rem;
            }

            .books-grid {
                grid-template-columns: 1fr;
            }

            .search-filter {
                padding: 15px;
                gap: 12px;
            }

            .filter-buttons {
                gap: 8px;
            }

            .filter-btn {
                padding: 8px 12px;
                font-size: 0.85rem;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 15px;
            }

            .stat-number {
                font-size: 1.5rem;
            }

            .book-header {
                padding: 15px;
            }

            .book-title {
                font-size: 1.1rem;
            }

            .book-body {
                padding: 15px;
            }

            .download-btn {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            header h1 {
                font-size: 1.5rem;
                margin-bottom: 8px;
            }

            header p {
                font-size: 0.9rem;
            }

            .search-filter {
                padding: 12px;
                margin-bottom: 20px;
            }

            .filter-buttons {
                gap: 6px;
                justify-content: center;
            }

            .filter-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }

            .info-item {
                padding: 6px;
                font-size: 0.85rem;
            }

            .volume-item {
                padding: 8px;
                margin-bottom: 6px;
            }

            .book-card {
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Books Database</h1>
            <p>Browse and download books with detailed information</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalBooks">0</div>
                <div class="stat-label">Total Books</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalVolumes">0</div>
                <div class="stat-label">Total Volumes</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalSize">0</div>
                <div class="stat-label">Total Size</div>
            </div>
        </div>

        <div class="search-filter">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search by title, author, or language...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All Books</button>
                <button class="filter-btn" data-filter="language">By Language</button>
                <button class="filter-btn" data-filter="size">By Size</button>
            </div>
        </div>

        <div id="booksContainer" class="books-grid">
            <div class="loading">Loading books...</div>
        </div>
    </div>

    <script src="books-index.js"></script>
    <script>
        let allBooks = [];
        let filteredBooks = [];
        let currentFilter = 'all';

        // Initialize the page
        async function init() {
            try {
                if (typeof booksData !== 'undefined') {
                    allBooks = booksData;
                    displayBooks(allBooks);
                    updateStats(allBooks);
                } else {
                    showError('Books data not found. Please ensure books-index.js is loaded correctly.');
                }
            } catch (error) {
                showError('Error loading books: ' + error.message);
            }
        }

        // Display books in grid
        function displayBooks(books) {
            const container = document.getElementById('booksContainer');
            
            if (books.length === 0) {
                container.innerHTML = '<div class="no-results"><p>No books found matching your criteria.</p></div>';
                return;
            }

            container.innerHTML = books.map(book => createBookCard(book)).join('');
        }

        // Create individual book card
        function createBookCard(book) {
            const volumesHTML = book.volumes && book.volumes.length > 0 
                ? `<div class="volumes-container">
                    <div class="volumes-title">📦 Volumes (${book.volumes.length})</div>
                    ${book.volumes.map(volume => `
                        <div class="volume-item">
                            <div class="volume-name">${volume.name}</div>
                            <div class="volume-size">Size: ${formatFileSize(volume.size)}</div>
                        </div>
                    `).join('')}
                   </div>`
                : '';

            return `
                <div class="book-card">
                    <div class="book-header">
                        <div class="book-title">${escapeHtml(book.title)}</div>
                        <div class="book-author">${escapeHtml(book.author || 'Unknown Author')}</div>
                    </div>
                    <div class="book-body">
                        <div class="book-info">
                            <div class="info-item">
                                <span class="info-label">Language</span>
                                <span class="info-value">${escapeHtml(book.language || 'N/A')}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Format</span>
                                <span class="info-value">${escapeHtml(book.format || 'N/A')}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Total Size</span>
                                <span class="info-value">${formatFileSize(book.totalSize || 0)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Year</span>
                                <span class="info-value">${book.year || 'N/A'}</span>
                            </div>
                        </div>
                        ${volumesHTML}
                        <div class="download-btn">
                            ${book.downloadUrl 
                                ? `<a href="${book.downloadUrl}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">📥 Download</a>` 
                                : '<button class="btn btn-secondary" disabled>No Download</button>'
                            }
                            ${book.infoUrl 
                                ? `<a href="${book.infoUrl}" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">ℹ️ Info</a>` 
                                : ''
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        // Format file size
        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        // Update statistics
        function updateStats(books) {
            let totalVolumes = 0;
            let totalSize = 0;

            books.forEach(book => {
                if (book.volumes) {
                    totalVolumes += book.volumes.length;
                }
                totalSize += (book.totalSize || 0);
            });

            document.getElementById('totalBooks').textContent = books.length;
            document.getElementById('totalVolumes').textContent = totalVolumes;
            document.getElementById('totalSize').textContent = formatFileSize(totalSize);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            filteredBooks = allBooks.filter(book => {
                return (book.title && book.title.toLowerCase().includes(query)) ||
                       (book.author && book.author.toLowerCase().includes(query)) ||
                       (book.language && book.language.toLowerCase().includes(query));
            });
            applyFilter();
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilter();
            });
        });

        // Apply filters
        function applyFilter() {
            let booksToDisplay = filteredBooks.length > 0 ? filteredBooks : allBooks;

            if (currentFilter === 'language') {
                booksToDisplay = booksToDisplay.sort((a, b) => 
                    (a.language || '').localeCompare(b.language || '')
                );
            } else if (currentFilter === 'size') {
                booksToDisplay = booksToDisplay.sort((a, b) => 
                    (b.totalSize || 0) - (a.totalSize || 0)
                );
            }

            displayBooks(booksToDisplay);
            updateStats(booksToDisplay);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return (text || '').replace(/[&<>"']/g, m => map[m]);
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('booksContainer');
            container.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
